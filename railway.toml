# =============================================================================
# Railway Configuration
# =============================================================================
# This file configures Railway deployment for Grafana.
# Database connection is configured via Railway environment variables.
# =============================================================================

[build]
builder = "dockerfile"
dockerfile = "custom/Dockerfile"

[deploy]
numReplicas = 1
healthcheckPath = "/"
healthcheckTimeout = 30
port = 3000

[services]
grafana = { port = 3000 }