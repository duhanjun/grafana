version: "3.8"

# =============================================================================
# Grafana Custom Docker Compose
# =============================================================================
# Usage:
#   # 开发环境启动（需要先设置环境变量）
#   cp custom/.env.example custom/.env
#   # 编辑 custom/.env 填写你的配置
#   docker compose -f custom/docker-compose.yaml --env-file custom/.env up -d
#
#   # Railway 部署时自动使用环境变量
# =============================================================================

services:
  grafana:
    image: grafana/grafana-oss:10.0.0
    container_name: Grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      # --- Database (MySQL) - from environment variables ---
      # Set these in your deployment platform (Railway, env file, etc.)
      # - GF_DATABASE_TYPE
      # - GF_DATABASE_HOST
      # - GF_DATABASE_NAME
      # - GF_DATABASE_USER
      # - GF_DATABASE_PASSWORD

      # --- Custom Grafana Settings ---
      - GF_SECURITY_ALLOW_EMBEDDING=true

      # --- Path overrides ---
      - GF_PATHS_CONFIG=/etc/grafana/grafana.ini
      - GF_PATHS_DATA=/var/lib/grafana
      - GF_PATHS_HOME=/usr/share/grafana
      - GF_PATHS_LOGS=/var/log/grafana
      - GF_PATHS_PLUGINS=/var/lib/grafana/plugins
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    restart: unless-stopped

volumes:
  grafana-data: